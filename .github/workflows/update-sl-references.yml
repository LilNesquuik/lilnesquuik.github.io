# Keeps SLReferences.zip in step with the SCP: Secret Laboratory dedicated server (Steam app 996560): installs it,
# compares its SCPSL_Data/Managed assemblies with the zip, and when they changed rebuilds the zip (those assemblies
# plus publicized Assembly-CSharp and Mirror) and commits it. Pages then serves the new file.
name: Update SLReferences.zip

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and commit the zip even when the game assemblies did not change.
        type: boolean
        default: false

permissions:
  contents: write
  # Pushes made with GITHUB_TOKEN do not always start the Pages build: it is requested after the commit.
  pages: write

concurrency:
  group: sl-references
  cancel-in-progress: false

env:
  APP_ID: '996560'
  PUBLICIZER_VERSION: '0.4.3'
  # The publicizer targets net6.0: run it on the runner's newer .NET.
  DOTNET_ROLL_FORWARD: Major
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  update:
    # Windows, like the servers and the CI that build against the zip.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the dedicated server
        id: server
        run: |
          $steamCmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $server = Join-Path $env:RUNNER_TEMP 'server'
          New-Item -ItemType Directory -Force -Path $steamCmd, $server | Out-Null
          $archive = Join-Path $steamCmd 'steamcmd.zip'
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath $steamCmd -Force
          $exe = Join-Path $steamCmd 'steamcmd.exe'
          $marker = Join-Path $server 'SCPSL_Data/Managed/Assembly-CSharp.dll'

          # A fresh SteamCMD updates itself on its first run and exits before app_update.
          & $exe +quit | Out-Null

          foreach ($attempt in 1..3) {
            & $exe +force_install_dir $server +login anonymous +app_update $env:APP_ID validate +quit
            # SteamCMD exit codes are unreliable: trust the installed assemblies instead.
            if (Test-Path -LiteralPath $marker) { break }
            Write-Warning "SteamCMD attempt $attempt left no managed assemblies."
            Start-Sleep -Seconds 15
          }

          if (-not (Test-Path -LiteralPath $marker)) {
            Write-Output "::error::SteamCMD could not install app $env:APP_ID."
            exit 1
          }

          $manifest = Get-Content (Join-Path $server "steamapps/appmanifest_$env:APP_ID.acf") -Raw
          $buildId = [regex]::Match($manifest, '"buildid"\s+"(\d+)"').Groups[1].Value
          "managed=$(Join-Path $server 'SCPSL_Data/Managed')" >> $env:GITHUB_OUTPUT
          "build=$buildId" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      # Publicized copies are generated, so only the game's own assemblies decide whether the zip is stale.
      - name: Compare with the zip
        id: compare
        env:
          MANAGED: ${{ steps.server.outputs.managed }}
        run: |
          function Hashes([string] $directory) {
            Get-ChildItem -LiteralPath $directory -Filter *.dll -File |
              Where-Object { $_.Name -notlike '*-Publicized.dll' } |
              Sort-Object Name |
              ForEach-Object { "$($_.Name) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          }

          $current = Join-Path $env:RUNNER_TEMP 'current'
          if (Test-Path SLReferences.zip) {
            Expand-Archive -LiteralPath SLReferences.zip -DestinationPath $current -Force
            $before = Hashes $current
          } else {
            $before = @()
          }

          $after = Hashes $env:MANAGED
          $changes = Compare-Object @($before) @($after)
          $changes | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
          "changed=$([bool]$changes)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Build the zip
        if: steps.compare.outputs.changed == 'true' || inputs.force
        env:
          MANAGED: ${{ steps.server.outputs.managed }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'references'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $env:MANAGED '*.dll') $out

          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          dotnet tool install BepInEx.AssemblyPublicizer.Cli --version $env:PUBLICIZER_VERSION --tool-path $tools
          $publicizer = Join-Path $tools 'assembly-publicizer'
          foreach ($name in 'Assembly-CSharp', 'Mirror') {
            & $publicizer (Join-Path $out "$name.dll") --output (Join-Path $out "$name-Publicized.dll")
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $out "$name-Publicized.dll"))) {
              Write-Output "::error::Could not publicize $name.dll."
              exit 1
            }
          }

          Remove-Item SLReferences.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*.dll') -DestinationPath SLReferences.zip -CompressionLevel Optimal
          "$((Get-ChildItem $out -Filter *.dll).Count) assemblies, $([math]::Round((Get-Item SLReferences.zip).Length / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY

      - name: Commit
        if: steps.compare.outputs.changed == 'true' || inputs.force
        env:
          BUILD: ${{ steps.server.outputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SLReferences.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'The zip did not change.'
            exit 0
          }

          git commit -m "Update SLReferences.zip to Steam build $env:BUILD"
          git push
          if ($LASTEXITCODE -ne 0) { exit 1 }

          gh api --method POST "repos/$env:GITHUB_REPOSITORY/pages/builds" --silent
          "Committed SLReferences.zip for Steam build $env:BUILD." >> $env:GITHUB_STEP_SUMMARY

      - name: Summary
        if: steps.compare.outputs.changed != 'true' && !inputs.force
        env:
          BUILD: ${{ steps.server.outputs.build }}
        run: '"Steam build $env:BUILD: the game assemblies match SLReferences.zip, nothing to do." >> $env:GITHUB_STEP_SUMMARY'
