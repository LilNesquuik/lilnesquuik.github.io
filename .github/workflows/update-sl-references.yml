# Keeps SLReferences.zip in step with the SCP: Secret Laboratory dedicated server (Steam app 996560). Every day it
# asks Steam for the build of the public branch and compares it with SLReferences.build. On a new build it installs
# the server, compares its SCPSL_Data/Managed assemblies with the zip, rebuilds the zip when they changed (those
# assemblies plus publicized Assembly-CSharp and Mirror), and commits it with the new build number. Pages then serves
# the new file.
name: Update SLReferences.zip

on:
  schedule:
    - cron: '1 21 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      force:
        description: Install the server and rebuild the zip even when the Steam build did not change.
        type: boolean
        default: false

permissions:
  contents: write
  # Pushes made with GITHUB_TOKEN do not always start the Pages build: it is requested after the commit.
  pages: write

concurrency:
  group: sl-references
  cancel-in-progress: false

env:
  APP_ID: '996560'
  PUBLICIZER_VERSION: '0.4.3'
  # The publicizer targets net6.0: run it on the runner's newer .NET.
  DOTNET_ROLL_FORWARD: Major
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  update:
    # Windows, like the servers and the CI that build against the zip.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Set up SteamCMD
        id: steamcmd
        run: |
          $steamCmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steamCmd | Out-Null
          $archive = Join-Path $steamCmd 'steamcmd.zip'
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath $steamCmd -Force
          $exe = Join-Path $steamCmd 'steamcmd.exe'

          # A fresh SteamCMD updates itself on its first run and exits before doing anything else.
          & $exe +quit | Out-Null
          "exe=$exe" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      # Reads the build of the public branch without installing anything.
      - name: Check the Steam build
        id: build
        env:
          STEAMCMD: ${{ steps.steamcmd.outputs.exe }}
        run: |
          $latest = ''
          foreach ($attempt in 1..3) {
            $info = & $env:STEAMCMD +login anonymous +app_info_update 1 +app_info_print $env:APP_ID +quit | Out-String
            $latest = [regex]::Match($info, '"branches"\s*\{\s*"public"\s*\{\s*"buildid"\s*"(\d+)"').Groups[1].Value
            if ($latest) { break }
            Write-Warning "SteamCMD attempt $attempt returned no build for app $env:APP_ID."
            Start-Sleep -Seconds 15
          }

          if (-not $latest) {
            Write-Output "::error::Could not read the public build of app $env:APP_ID from Steam."
            exit 1
          }

          $known = if (Test-Path SLReferences.build) { (Get-Content SLReferences.build -Raw).Trim() } else { '' }
          "Steam build $latest, SLReferences.zip built from $(if ($known) { $known } else { 'an unknown build' })."
          "latest=$latest" >> $env:GITHUB_OUTPUT
          "current=$($latest -eq $known)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v6
        if: steps.build.outputs.current != 'true' || inputs.force
        with:
          dotnet-version: 10.0.x

      - name: Install the dedicated server
        id: server
        if: steps.build.outputs.current != 'true' || inputs.force
        env:
          STEAMCMD: ${{ steps.steamcmd.outputs.exe }}
        run: |
          $server = Join-Path $env:RUNNER_TEMP 'server'
          New-Item -ItemType Directory -Force -Path $server | Out-Null
          $marker = Join-Path $server 'SCPSL_Data/Managed/Assembly-CSharp.dll'

          foreach ($attempt in 1..3) {
            & $env:STEAMCMD +force_install_dir $server +login anonymous +app_update $env:APP_ID validate +quit
            # SteamCMD exit codes are unreliable: trust the installed assemblies instead.
            if (Test-Path -LiteralPath $marker) { break }
            Write-Warning "SteamCMD attempt $attempt left no managed assemblies."
            Start-Sleep -Seconds 15
          }

          if (-not (Test-Path -LiteralPath $marker)) {
            Write-Output "::error::SteamCMD could not install app $env:APP_ID."
            exit 1
          }

          # The installed build, which may be newer than the one checked a few minutes earlier.
          $manifest = Get-Content (Join-Path $server "steamapps/appmanifest_$env:APP_ID.acf") -Raw
          $installed = [regex]::Match($manifest, '"buildid"\s+"(\d+)"').Groups[1].Value
          if (-not $installed) {
            Write-Output "::error::The app manifest has no build id."
            exit 1
          }

          "managed=$(Join-Path $server 'SCPSL_Data/Managed')" >> $env:GITHUB_OUTPUT
          "build=$installed" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      # Publicized copies are generated, so only the game's own assemblies decide whether the zip is stale.
      - name: Compare with the zip
        id: compare
        if: steps.server.outcome == 'success'
        env:
          MANAGED: ${{ steps.server.outputs.managed }}
        run: |
          function Hashes([string] $directory) {
            Get-ChildItem -LiteralPath $directory -Filter *.dll -File |
              Where-Object { $_.Name -notlike '*-Publicized.dll' } |
              Sort-Object Name |
              ForEach-Object { "$($_.Name) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          }

          $current = Join-Path $env:RUNNER_TEMP 'current'
          if (Test-Path SLReferences.zip) {
            Expand-Archive -LiteralPath SLReferences.zip -DestinationPath $current -Force
            $before = Hashes $current
          } else {
            $before = @()
          }

          $after = Hashes $env:MANAGED
          $changes = Compare-Object @($before) @($after)
          $changes | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }
          "changed=$([bool]$changes)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Build the zip
        if: steps.compare.outputs.changed == 'true' || (steps.server.outcome == 'success' && inputs.force)
        env:
          MANAGED: ${{ steps.server.outputs.managed }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'references'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $env:MANAGED '*.dll') $out

          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          dotnet tool install BepInEx.AssemblyPublicizer.Cli --version $env:PUBLICIZER_VERSION --tool-path $tools
          $publicizer = Join-Path $tools 'assembly-publicizer'
          foreach ($name in 'Assembly-CSharp', 'Mirror') {
            & $publicizer (Join-Path $out "$name.dll") --output (Join-Path $out "$name-Publicized.dll")
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $out "$name-Publicized.dll"))) {
              Write-Output "::error::Could not publicize $name.dll."
              exit 1
            }
          }

          Remove-Item SLReferences.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*.dll') -DestinationPath SLReferences.zip -CompressionLevel Optimal
          "$((Get-ChildItem $out -Filter *.dll).Count) assemblies, $([math]::Round((Get-Item SLReferences.zip).Length / 1MB, 1)) MB" >> $env:GITHUB_STEP_SUMMARY

      # Records the installed build even when its assemblies did not change, so the next run skips it.
      - name: Commit
        if: steps.server.outcome == 'success'
        env:
          BUILD: ${{ steps.server.outputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-Content -Path SLReferences.build -Value $env:BUILD -NoNewline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SLReferences.zip SLReferences.build
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "Steam build $env:BUILD: nothing changed." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $zipChanged = git diff --cached --name-only -- SLReferences.zip
          $message = if ($zipChanged) { "Update SLReferences.zip to Steam build $env:BUILD" } else { "Record Steam build $env:BUILD (assemblies unchanged)" }
          git commit -m $message
          git push
          if ($LASTEXITCODE -ne 0) { exit 1 }

          if ($zipChanged) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/pages/builds" --silent
          }

          "$message." >> $env:GITHUB_STEP_SUMMARY

      - name: Summary
        if: steps.build.outputs.current == 'true' && !inputs.force
        env:
          BUILD: ${{ steps.build.outputs.latest }}
        run: '"Steam build $env:BUILD is the one SLReferences.zip was built from: nothing to do." >> $env:GITHUB_STEP_SUMMARY'
